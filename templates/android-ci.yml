# Enable only once the Android Gradle project and checked-in wrapper are working.
# Copy to: .github/workflows/android-ci.yml
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # Align with the selected Android Gradle Plugin version.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seerrfin-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
