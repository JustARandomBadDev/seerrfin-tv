name: Bug report
description: Report a reproducible bug
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Press ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android TV version and device model
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs (optional)
      description: Remove server IPs, tokens and personal media data.
